<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta name="theme-color" content="#0b0b10" />
    <title>Offline · AKH Mastani</title>
    <style>
      body {
        margin: 0;
        background: #0b0b10;
        color: #f5f5fa;
        font: 16px system-ui;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      main {
        max-width: 24rem;
        padding: 2rem;

      p {

        color: #9690ff;
        display: inline-block;

  <body>
    <main>
      <h1>You’re offline</h1>
